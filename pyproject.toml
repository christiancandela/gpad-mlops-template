[project]
name = "gpad-mlops-template"
version = "0.1.0"
description = "Plantilla MLOps del curso Gerencia de Proyectos de Analítica de Datos (Universidad del Quindío)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Dependencias de ejecución de la API (lo único que se instala en la imagen Docker).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
# Herramientas del ciclo de vida del modelo (entrenamiento, versionado, validación, monitoreo).
ml = [
    "dvc>=3.50",
    "mlflow>=3.1",
    "pandera>=0.24",
    "evidently>=0.7",
    "matplotlib>=3.8",
]
# Asistente de explicación con LLM (taller LLMOps, S7): SDK oficial de Claude.
# Ollama (modelo local) se usa por HTTP y no requiere paquete adicional.
llm = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
package = false
default-groups = ["ml", "llm", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model: pruebas que requieren un modelo entrenado (ejecutar después de `dvc repro`)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
